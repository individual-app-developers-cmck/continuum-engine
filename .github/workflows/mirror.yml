name: Mirror to GitLab
on:
  push:
    branches: [ main ]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git push -f https://oauth2:${GITLAB_TOKEN}@gitlab.com/self-employed-group231446/continuum-engine-core.git main
